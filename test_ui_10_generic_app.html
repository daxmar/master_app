<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generic App - Prototype UI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
        }
        .features {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .feature-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 500;
        }
        .feature-btn:hover {
            background: #007bff;
            color: white;
            border-color: #007bff;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,123,255,0.3);
        }
        .output {
            padding: 30px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            min-height: 200px;
        }
        .output h3 {
            margin-top: 0;
            color: #495057;
        }
        .output-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .footer {
            background: #343a40;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Generic App</h1>
            <p>Prototype UI - Tema: Data, Horor, VR</p>
        </div>
        <div class="features">
            <button onclick="runFeature('Fitur dasar aplikasi')" class="feature-btn">Fitur dasar aplikasi</button><button onclick="runFeature('Pengaturan pengguna')" class="feature-btn">Pengaturan pengguna</button><button onclick="runFeature('Dashboard sederhana')" class="feature-btn">Dashboard sederhana</button>
        </div>
        <div class="output">
            <h3>Output</h3>
            <div class="output-content" id="outputContent">
                Klik salah satu fitur di atas untuk melihat hasilnya.
            </div>
        </div>
    </div>
    <div class="footer">
        <p>Generated by Master APP AI Agent - 2026-05-06</p>
    </div>

    <script>
        function runFeature(featureName) {
            const output = document.getElementById('outputContent');
            output.textContent = `Menjalankan fitur: ${featureName}\n\nIni adalah simulasi prototype.\nFitur lengkap akan diimplementasikan dalam versi final.`;
        }
    </script>
</body>
</html>
